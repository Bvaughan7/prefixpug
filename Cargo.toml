[package]
name = "prefixpug"
version = "0.2.1"
edition = "2021"
authors = ["PrefixPug Developers <https://github.com/PrefixPug/prefixpug>"]
description = "Safely sniffs out and reclaims orphaned Steam/Proton compatdata and shader caches"
readme = "README.md"
license = "MIT"
repository = "https://github.com/PrefixPug/prefixpug"
keywords = ["steam", "proton", "storage", "compatdata", "linux"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
dirs = "6.0.0"
flate2 = "1.1.10"
keyvalues-parser = "0.2.4"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = "0.4.46"
walkdir = "2.5.0"
sha2 = "0.10"
crc32fast = "1.4"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

